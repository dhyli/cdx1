name: Build Daemon

on:
  push:
    branches: [ main, master ]
    paths:
      - 'redirect_daemon.c'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - arch: arm64
            ndk_arch: aarch64
            ndk_api: 24
            cross_prefix: aarch64-linux-android
          - arch: arm
            ndk_arch: armv7a
            ndk_api: 24
            cross_prefix: armv7a-linux-androideabi

    steps:
    - uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26c
        add-to-path: true

    - name: Set up build environment
      run: |
        echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
        echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

    - name: Build daemon
      run: |
        TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
        CC="$TOOLCHAIN/${{ matrix.cross_prefix }}${{ matrix.ndk_api }}-clang"

        echo "Compiler: $CC"
        $CC --version

        $CC -static -O2 -Wall -Wextra -Wno-unused-parameter             -o bin/daemon_${{ matrix.arch }}             redirect_daemon.c             -lpthread

    - name: Verify binary
      run: |
        file bin/daemon_${{ matrix.arch }}
        ls -lh bin/daemon_${{ matrix.arch }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: daemon-${{ matrix.arch }}
        path: bin/daemon_${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Prepare release assets
      run: |
        mkdir -p release/bin
        cp artifacts/daemon_* release/bin/
        cp -r scripts release/
        cp -r config release/
        cp module.json module.prop customize.sh service.sh post-fs-data.sh uninstall.sh webui.html build.sh release/
        cd release && zip -r ../redirector-${GITHUB_REF#refs/tags/}.zip .

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: redirector-*.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
